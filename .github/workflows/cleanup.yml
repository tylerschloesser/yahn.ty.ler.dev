# Safety net for a PR teardown that failed, or raced an in-flight deploy.
#
# This replaces a hand-written shell sweep over `aws cloudformation
# list-stacks` with the package's own `cdk-core sweep`, which reconciles
# stacks, KVS keys, S3 prefixes and log groups against open PRs. A second,
# divergent implementation here would only drift from the package's, which
# is the one that is tested. That means this workflow needs the repo checked
# out and installed (the sweeper is the package's bin, so `infra/cdk` has to
# resolve it).
#
# Nothing here decides which stacks are safe to touch — that is the
# sweeper's job. The two things standing between this cron and every other
# stack in the account are the sweeper's own anchored `^Yahn-pr-[0-9]+$`
# match and the deploy role's IAM scope, and neither lives in this file.

name: Cleanup

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # The package comes prebuilt from npm, so `pnpm install
      # --frozen-lockfile` alone makes the `cdk-core` bin resolve under
      # infra/cdk — there is no workspace package to build first.
      - run: pnpm install --frozen-lockfile

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: github-actions-cleanup

      # infra/cdk depends on @tylerschloesser/cdk-core, so its bin resolves
      # there. GH_TOKEN is needed because the sweeper shells out to
      # `gh pr view` to decide whether a PR is still open.
      - run: pnpm --filter @yahn/cdk exec cdk-core sweep --site yahn.ty.ler.dev --stack-prefix Yahn --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
