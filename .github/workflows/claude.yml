# Claude Code GitHub Action. Responds when someone with write access mentions
# @claude in an issue, an issue comment, a PR review or a PR review comment.
# Interactive mode (no `prompt`): Claude reads the request from the event,
# replies on the same issue or PR, and pushes a branch when asked to implement
# something. Opening the PR from that branch is *not* the action's default —
# see the `gh pr create` note on the allowlist below.
#
# Authenticates with a Claude subscription token (`claude setup-token`) stored
# as the CLAUDE_CODE_OAUTH_TOKEN repository secret. The Claude GitHub App must
# also be installed on the repo. Editing a file under `.github/workflows/`
# needs a second, repo-owned App on top of that — see the `app-token` step
# below, which is skipped and harmless until it is configured. See
# .claude/rules/cdk.md.
#
# The `issues: opened` trigger means an issue whose title or body contains
# "@claude" starts a run the moment it is created. Issues Claude files never
# contain the phrase; a person adds it as a comment.

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# One run at a time per issue or PR, so two comments don't race on a branch.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Same toolchain as deploy.yml, so pnpm lint/typecheck/build work in the run.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm e2e` is in the allowlist below, and without the browser it would
      # fail on its first run every time. ~30s, paid on runs that never use it,
      # which is cheaper than a run that cannot check its own UI work.
      - run: pnpm exec playwright install --with-deps chromium

      # The one thing a run cannot do with the stock token: edit a workflow.
      #
      # The Claude GitHub App token the action exchanges its OIDC token for has
      # no `workflows` permission, and the job's `permissions:` block above
      # cannot grant it either — GitHub has no `workflows:` key there. So a run
      # that touches `.github/workflows/**` does the whole job and then dies at
      # `git push` with "refusing to allow a GitHub App to create or update
      # workflow ... without `workflows` permission". Issue #23 ended exactly
      # there: a correct 17-line fix, committed, unpushable, pasted into a
      # comment for a human to apply by hand.
      #
      # A repo-owned GitHub App that *does* hold the permission is the
      # documented way out — that is what the action's `github_token` input is
      # for (anthropics/claude-code-action `docs/faq.md`: "only include this if
      # you're connecting a custom GitHub app").
      #
      # Gated on the variable so this stays inert until that App exists. With
      # the step skipped `steps.app-token.outputs.token` is the empty string,
      # and the action's own `if (providedToken)` (`src/github/token.ts`) falls
      # straight back to the claude[bot] OIDC token — so an unconfigured repo
      # behaves exactly as it did before this step was added. Set the variable
      # and the secret and Claude can edit its own CI; leave them and nothing
      # changes.
      #
      # Setup, once: a GitHub App owned by this account with Contents,
      # Pull requests, Issues and **Workflows** at read/write and Actions at
      # read, installed on this repo; its id as the CLAUDE_APP_ID repository
      # *variable* (not a secret — it is public, and `vars` is what an `if:`
      # can read) and its private key as the CLAUDE_APP_PRIVATE_KEY secret.
      #
      # The visible cost: comments and commits then come from that App rather
      # than claude[bot]. `use_sticky_comment` would break under a custom token
      # — this workflow does not use it. PRs still start `ci.yml` and
      # `pr-preview.yml`, because an App token is not the default GITHUB_TOKEN
      # and the workflow-from-workflow suppression does not apply to it.
      - name: Mint a token that may edit workflows
        id: app-token
        if: vars.CLAUDE_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Empty when the step above was skipped, which the action reads as
          # "not provided" and ignores. See that step's comment.
          github_token: ${{ steps.app-token.outputs.token }}
          # `pnpm verify` is the whole point: it is lint + typecheck + test +
          # build, it is what every other job in this repo runs, and it needs
          # no credentials. Its four parts are listed too, because a run that
          # only wants to re-check types should not have to run the lot.
          #
          # `pnpm e2e` boots its own dev servers and drives a real browser
          # against live HN. Without it a run cannot check its own UI work and
          # has to guess, which is exactly what happened the first time this
          # workflow ran: it shipped a correct fix it could not verify, and
          # said so.
          #
          # `gh issue`/`gh pr` reads are here so a run that finds something
          # outside its task can use the `file-issue` skill instead of
          # dropping the finding — the first run could not, and had to leave
          # it in a comment.
          #
          # `gh pr create` and the `--append-system-prompt` below are what make
          # a run open its own PR. The action does not do this on its own and
          # will not be persuaded by the allowlist alone: its built-in prompt
          # says "Provide a URL to create a PR manually", by design, so that
          # branch protection stays in the human's hands
          # (anthropics/claude-code-action docs/faq.md). Issues #8 and #9 both
          # ended as a pushed branch and a compare link nobody had clicked.
          # Overriding it takes both halves — the tool and the instruction —
          # and the append runs *after* the built-in prompt, which is why it
          # wins.
          #
          # `gh pr checks`, `gh run view` and `sleep` are what let the run wait
          # for the CI it just started, and it could not before: `gh pr create`
          # was the last thing it did, so PR #22 was reported as finished eleven
          # seconds before its own preview run began — and that run failed.
          # Ordering makes the wait unavoidable rather than optional: the checks
          # do not exist until the PR does, so nothing earlier in the run can
          # cover them. `--watch` blocks, which is why no polling loop is needed
          # and why the one `sleep` is only for the gap before the checks
          # register at all.
          #
          # This is the one change here that costs real runner minutes: the job
          # now idles through `pr-preview.yml`, which is ~6-7 min of deploy plus
          # e2e. That is the price of a run that cannot say "done" over a red
          # PR, and it is worth it.
          claude_args: |
            --allowedTools "Bash(pnpm verify),Bash(pnpm lint),Bash(pnpm lint:fix),Bash(pnpm typecheck),Bash(pnpm test),Bash(pnpm build),Bash(pnpm e2e),Bash(pnpm e2e:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue create:*),Bash(gh issue comment:*),Bash(gh search:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr create:*),Bash(gh pr checks:*),Bash(gh run view:*),Bash(gh label list:*),Bash(sleep:*)"
            --append-system-prompt "This repository wants you to open the pull request yourself, which overrides the instruction above to provide a manual compare URL. Whenever you have pushed a branch with changes, run: gh pr create --base main --head THE_BRANCH_YOU_PUSHED --title ... --body ... . Write the body as Summary and Test plan sections, state what you ran and what you could not run, and include the line Fixes #N when the work closes an issue. Then report the URL of the PR you created rather than a compare link. If gh pr create fails, fall back to the compare link and say plainly that it failed and why. After the PR exists, wait for its checks rather than ending the run: sleep 60 so the checks register, then run gh pr checks THE_PR_NUMBER --watch --interval 30 --fail-fast=false, which blocks until every check has finished. If that command reports that no checks exist yet, sleep 60 and run it once more before giving up on waiting. When a check fails, read its log with gh run view --job JOB_ID --log-failed, and say in your comment which check failed and what the failing output was. Do not describe a red or still-running PR as done, and do not claim CI is green unless gh pr checks actually said so."
