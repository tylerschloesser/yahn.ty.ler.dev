# Claude Code GitHub Action. Responds when someone with write access mentions
# @claude in an issue, an issue comment, a PR review or a PR review comment.
# Interactive mode (no `prompt`): Claude reads the request from the event,
# replies on the same issue or PR, and pushes a branch and opens a PR when
# asked to implement something.
#
# Authenticates with a Claude subscription token (`claude setup-token`) stored
# as the CLAUDE_CODE_OAUTH_TOKEN repository secret. The Claude GitHub App must
# also be installed on the repo. See .claude/rules/cdk.md.
#
# The `issues: opened` trigger means an issue whose title or body contains
# "@claude" starts a run the moment it is created. Issues Claude files never
# contain the phrase; a person adds it as a comment.

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# One run at a time per issue or PR, so two comments don't race on a branch.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Same toolchain as deploy.yml, so pnpm lint/typecheck/build work in the run.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Bash(pnpm lint),Bash(pnpm lint:fix),Bash(pnpm typecheck),Bash(pnpm build)"
