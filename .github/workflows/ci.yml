# The fast local signal on every PR. Runs in parallel with the preview
# deploy in pr-preview.yml rather than waiting on it, because this job
# needs no AWS credentials and leaves nothing behind server-side — so
# cancelling an in-progress run when a new commit lands is always safe.
#
# `pnpm verify` is used here rather than `pnpm -r run typecheck`: the
# recursive form only runs each package's own typecheck script and
# silently skips the e2e specs, which live in the root-only
# tsconfig.e2e.json project and are only covered by the root
# `pnpm typecheck` (see package.json).

name: CI

on: pull_request

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
